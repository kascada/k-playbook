<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>k-playbook</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-mode="{{.Mode}}">
    <main class="shell">
      <section class="hero app-header">
        <div class="brand-row">
          <img class="brand-logo" src="/static/logo.png" alt="k-playbook Logo">
          <h1>k-playbook</h1>
        </div>
        <div class="hero-subrow">
          <p class="eyebrow path">
            <span class="mode-badge">{{.ModeLabel}}</span>
            {{if .Path}}{{.Path}}{{end}}
          </p>
          <div class="hero-actions">
            <button id="shutdown" class="secondary danger">Schliessen</button>
          </div>
        </div>
      </section>

      <section class="card" id="assistant-card">
        <div class="section-head">
          <div>
            <p class="eyebrow">Schritt 1</p>
            <h2>Commands und Skills</h2>
          </div>
          <span id="assistant-pill" class="pill muted">Pruefen...</span>
        </div>
        <dl id="assistant-facts" class="facts"></dl>
        <p id="assistant-message" class="message"></p>
        <button id="assistant-apply" class="secondary" disabled>Aktualisieren</button>
      </section>

      <div id="closed" class="closed hidden">
        <div class="card">
          <p class="eyebrow">k-playbook beendet</p>
          <h2 id="closed-title">Dieses Browserfenster kann jetzt geschlossen werden.</h2>
          <p id="closed-message" class="message hidden"></p>
        </div>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
