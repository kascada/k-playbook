<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks - k-playbook</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-mode="{{.Mode}}">
    <main class="shell">
      <section class="hero app-header">
        <div class="brand-row">
          <img class="brand-logo" src="/static/logo.png" alt="k-playbook Logo">
          <h1>Tasks</h1>
        </div>
        <div class="hero-subrow">
          <p class="eyebrow path">
            <span class="path-entry">
              <span class="path-key">{{.ModeLabel}}:</span>
              {{if .Path}}{{.Path}}{{end}}
            </span>
            <span class="path-entry{{if not .PlaybookDir}} hidden{{end}}"
                  title="Hieraus kommen Skripte, Regeln, Reviews und Checks. Eigener Clone, kann einen anderen Stand tragen.">
              <span class="path-key">Installation:</span>
              {{.PlaybookDir}}
            </span>
          </p>
          <div class="hero-actions">
            <a class="button-link secondary" href="/">Zurück</a>
          </div>
        </div>
      </section>

      <div class="blocks">
        <section class="card" id="list-card">
          <div class="section-head">
            <div>
              <h2>Offene Tasks</h2>
            </div>
            <span id="tasks-pill" class="pill muted">Laden...</span>
          </div>
          <p class="hint">
            Aus <code>k-playbook-local/tasks/</code>, nach Nummer geordnet. Erledigte liegen in
            <code>done/</code> und stehen hier nicht mehr.
          </p>
          <div id="tasks-list" class="task-list empty"></div>
          <p id="tasks-message" class="message"></p>
        </section>

        <!-- Der Inhalt steht unter der Liste statt in einem Fenster darüber:
             die Liste bleibt dadurch sichtbar, und der nächste Task ist einen
             Klick entfernt. -->
        <section class="card hidden" id="task-card">
          <div class="section-head">
            <div>
              <p class="eyebrow" id="task-path"></p>
              <h2 id="task-title">Task</h2>
            </div>
          </div>
          <article id="task-viewer" class="doc-viewer inline"></article>
        </section>
      </div>
    </main>

    <script src="/static/session.js"></script>
    <script src="/static/tasks.js"></script>
  </body>
</html>
