<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - k-playbook</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-mode="{{.Mode}}">
    <main class="shell wide">
{{template "hero" .}}

      <div class="layout">
{{template "sidebar" .}}
        <!-- Das Menü links entsteht hier nicht aus Karten, sondern aus der
             Dateiliste: dieser Bereich hat genau einen Inhalt, und das ist die
             gerade geöffnete Datei. -->
        <div class="blocks">
          <section class="card" id="doc-card">
            <div class="section-head">
              <div>
                <p class="eyebrow" id="doc-path"></p>
                <h2 id="doc-title">Dokumentation</h2>
              </div>
            </div>
            <article id="doc-viewer" class="doc-viewer"></article>
            <p id="docs-message" class="message"></p>
          </section>
        </div>
      </div>
    </main>

    <script src="/static/session.js"></script>
    <script src="/static/nav.js"></script>
    <script src="/static/docview.js"></script>
    <script src="/static/docs.js"></script>
  </body>
</html>
