<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} - k-playbook</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body data-mode="{{.Mode}}">
    <main class="shell">
{{template "hero" .}}

      <div class="layout">
{{template "sidebar" .}}
        <div class="blocks">
          <!-- Die Übersicht des Bereichs: was die drei Sorten sind, wie viel
               in jeder liegt und der Weg zu ihrer Seite. Die Listen selbst
               stehen dort und nicht hier — dreimal Liste untereinander war
               eine Seite, auf der man scrollte, statt zu lesen. -->
          <section class="card" id="workflows-intro-card">
            <div class="section-head">
              <div>
                <h2>Was Workflows sind</h2>
              </div>
              <!-- Der Verweis in die mitgelieferte Doku: er öffnet die Datei im
                   Bereich Docs, mit Index und Querverweisen. Dasselbe Muster
                   trägt jeder Hilfe-Block dieser Seiten. -->
              <a class="doc-link" href="/docs?file=commands.md"
                 title="Öffnet commands.md im Bereich Docs: alle Commands mit ihrer Zuständigkeit.">Doku: Commands</a>
            </div>
            <p class="hint">
              Die drei Sorten, in denen hier gearbeitet wird. Angelegt und ausgeführt wird
              jede im Assistenten; die Oberfläche zeigt nur, was vorliegt.
            </p>
          </section>

{{template "workflow-cards" .}}

          <p id="workflows-message" class="message"></p>
        </div>
      </div>
    </main>

    <script src="/static/session.js"></script>
    <script src="/static/nav.js"></script>
    <script src="/static/workflows.js"></script>
    <script src="/static/workflows-page.js"></script>
  </body>
</html>
