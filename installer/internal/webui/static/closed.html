{{define "closed"}}
      <!-- Sperrfläche, wenn der Dienst weg ist: beendet aus diesem oder einem
           anderen Fenster, per k-playbook stop, nach einem Update oder im
           Leerlauf. Kein Sackgassen-Text: erst „Erneut verbinden", und erst
           wenn das scheitert, der Weg über das Terminal. Gemeinsames Fragment
           der Statusseite und von /setup; bedient wird es aus service.js. -->
      <div id="closed" class="closed hidden">
        <div class="card">
          <p class="eyebrow">k-playbook</p>
          <h2 id="closed-title">Der Dienst ist beendet, für alle Fenster dieses Projekts.</h2>
          <p id="closed-message" class="message hidden"></p>
          <div class="closed-actions">
            <button id="closed-reconnect" class="secondary">Erneut verbinden</button>
          </div>
          <p id="closed-hint" class="message hidden">Der Dienst antwortet nicht. Im Terminal <code>k-playbook</code> aufrufen: das startet ihn neu und öffnet die Oberfläche unter neuer Adresse.</p>
        </div>
      </div>
{{end}}
