{{define "hero"}}
      <!-- Der Kopf jeder Seite: Logo, Titel, Version und die aufgelösten
           Pfade. Keine Seite hat einen eigenen; sie unterscheiden sich allein
           im Titel und im Aktionsblock.

           Der Aktionsblock mit den Knöpfen für Update und Dienst schaltet sich
           über die Felder, die renderPage ohnehin übergibt — eine Seitendatei
           kann dem Fragment nichts mitgeben. Er steht auf der Statusseite und
           auf /setup, solange keine Projektkonfiguration besteht: dann leitet
           / nach /setup, und ohne diesen Zweig gäbe es „Dienst beenden"
           nirgends. (not .Installed) allein reichte nicht — ohne
           Konfiguration liefern auch die übrigen Seiten aus, laden service.js
           aber nicht, und dort stünden tote Knöpfe. Der Update-Knopf startet
           verborgen; service.js zeigt ihn erst, wenn ein Update anliegt. -->
      <section class="hero app-header">
        <div class="brand-row">
          <img class="brand-logo" src="/static/logo.png" alt="k-playbook Logo">
          <h1>{{.Title}}</h1>
          <span class="version-badge" title="Version des k-playbook-Binarys, das diesen Dienst bereitstellt. Die Installation daneben kann einen anderen Stand tragen.">{{.Version}}</span>
        </div>
        <div class="hero-subrow">
          <p class="eyebrow path">
            <span class="path-entry">
              <span class="path-key">{{.ModeLabel}}:</span>
              {{if .Path}}{{.Path}}{{end}}
            </span>
            <span class="path-entry{{if not .RepoRoot}} hidden{{end}}">
              <span class="path-key">Repository:</span>
              {{.RepoRoot}}
            </span>
            <span class="path-entry{{if not .PlaybookDir}} hidden{{end}}"
                  title="Hieraus kommen Skripte, Regeln, Reviews und Checks. Eigener Clone, kann einen anderen Stand tragen.">
              <span class="path-key">Installation:</span>
              {{.PlaybookDir}}
            </span>
          </p>
          {{if or (eq .Area "status") (and (eq .Page "/setup") (not .Installed))}}
          <div class="hero-actions">
            <button id="update" class="secondary hidden">Update prüfen</button>
            <button id="shutdown" class="secondary danger"
                    title="Beendet den Hintergrunddienst dieses Projekts, für alle Fenster.">Dienst beenden</button>
          </div>
          {{end}}
        </div>
      </section>
{{end}}
