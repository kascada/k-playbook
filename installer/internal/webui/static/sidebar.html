{{define "sidebar"}}
        <div class="sidebar">
          <!-- Der Umschalter ist server-gerendert: welche Bereiche es gibt,
               hängt an der Installation, und welcher aktiv ist, weiß nur die
               Seite selbst.

               aria-current unterscheidet zwei Fälle: "page" führt nur der
               Verweis auf die offene Seite, "true" der aktive Bereich, dessen
               Ziel eine andere Seite ist. Auf /mcp ist Setup aktiv, / ist aber
               nicht offen — dort wäre "page" eine falsche Auskunft. -->
          <nav class="area-nav" aria-label="Bereiche">
            <a class="area-nav-item{{if eq .Area "setup"}} active{{end}}" href="/"{{if eq .Area "setup"}} aria-current="{{if eq .Page "/"}}page{{else}}true{{end}}"{{end}}>Setup</a>
            {{if .Installed}}
            <a class="area-nav-item{{if eq .Area "workflows"}} active{{end}}" href="/workflows"{{if eq .Area "workflows"}} aria-current="{{if eq .Page "/workflows"}}page{{else}}true{{end}}"{{end}}>Workflows</a>
            <a class="area-nav-item{{if eq .Area "docs"}} active{{end}}" href="/docs"{{if eq .Area "docs"}} aria-current="{{if eq .Page "/docs"}}page{{else}}true{{end}}"{{end}}>Docs</a>
            <a class="area-nav-item{{if eq .Area "inventory"}} active{{end}}" href="/inventory"{{if eq .Area "inventory"}} aria-current="{{if eq .Page "/inventory"}}page{{else}}true{{end}}"{{end}}>Inventar</a>
            {{end}}
          </nav>

          <!-- Die Einträge entstehen zur Laufzeit aus den Blöcken daneben,
               damit ein neuer Block nicht an zwei Stellen gepflegt werden
               muss. Auf /docs trägt dasselbe Element stattdessen den
               Dateiindex; Modifier und Beschriftung dafür kommen aus derselben
               .Area-Weiche, serverseitig und nicht beim Füllen aus docs.js:
               schmal bliebe der Index sonst so lange ausgeblendet, bis
               /api/docs antwortet. -->
          <nav id="block-nav"
               class="block-nav{{if eq .Area "docs"}} file-index{{end}}"
               aria-label="{{if eq .Area "docs"}}Dateien der Doku{{else}}Inhalt dieser Seite{{end}}"></nav>

          <!-- Der Server hält keinen Zustand und liest die Platte bei jeder
               Anfrage neu; ein frischer Stand ist deshalb genau ein Neuladen
               der Seite. Der Knopf steht auf jeder Seite, weil der Weg dahin
               sonst über das Terminal führte. Er behält seine Höhe wie jeder
               Kasten der Spalte — nachgeben tut allein das Blockmenü. -->
          <button type="button" id="reload-page" class="secondary reload-page"
                  title="Lädt die Seite neu und holt damit den vollständigen Stand von der Platte.">Neu einlesen</button>
        </div>
{{end}}
