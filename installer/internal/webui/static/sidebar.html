{{define "sidebar"}}
        <div class="sidebar">
          <!-- Der Umschalter ist server-gerendert: welche Bereiche es gibt,
               hängt an der Installation, und welcher aktiv ist, weiß nur die
               Seite selbst.

               aria-current unterscheidet zwei Fälle: "page" führt nur der
               Verweis auf die offene Seite, "true" der aktive Bereich, dessen
               Ziel eine andere Seite ist. Auf /mcp ist Setup aktiv, /setup ist
               aber nicht offen — dort wäre "page" eine falsche Auskunft.

               Status steht als erster Eintrag und nur mit Projektkonfiguration:
               ohne sie leitet / nach /setup, und der Eintrag führte auf eine
               sofortige Umleitung. Deshalb ein eigener Zweig über Setup, das
               selbst außerhalb beider Zweige bleibt.

               Zwei Bereiche haben mehrere gleichrangige Seiten. Workflows hat
               drei, die als Unterpunkte darunter stehen; Setup hat die
               Übersicht der MCP-Server, und ihre Detailseiten laufen unter
               demselben Unterpunkt: aktiv bei jedem Pfad unter /mcp-servers,
               aria-current="page" nur auf der Übersicht selbst. /mcp hat
               keinen Unterpunkt — die Karte und die Detailseite des eigenen
               Servers führen dorthin. Die Unterpunkte stehen in jedem Bereich:
               wer von Setup aus zu den Tasks will, soll nicht erst die
               Übersicht laden müssen. Ohne Installation gibt es keine
               MCP-Dateien und keinen Unterpunkt, wie bei Workflows. -->
          <nav class="area-nav" aria-label="Bereiche">
            {{if .Installed}}
            <a class="area-nav-item{{if eq .Area "status"}} active{{end}}" href="/"{{if eq .Area "status"}} aria-current="{{if eq .Page "/"}}page{{else}}true{{end}}"{{end}}>Status</a>
            {{end}}
            <a class="area-nav-item{{if eq .Area "setup"}} active{{end}}" href="/setup"{{if eq .Area "setup"}} aria-current="{{if eq .Page "/setup"}}page{{else}}true{{end}}"{{end}}>Setup</a>
            {{if .Installed}}
            <a class="area-nav-subitem{{if hasPrefix .Page "/mcp-servers"}} active{{end}}" href="/mcp-servers"{{if eq .Page "/mcp-servers"}} aria-current="page"{{end}}>MCP-Server</a>
            <a class="area-nav-item{{if eq .Area "workflows"}} active{{end}}" href="/workflows"{{if eq .Area "workflows"}} aria-current="{{if eq .Page "/workflows"}}page{{else}}true{{end}}"{{end}}>Workflows</a>
            <a class="area-nav-subitem{{if eq .Page "/workflows/tasks"}} active{{end}}" href="/workflows/tasks"{{if eq .Page "/workflows/tasks"}} aria-current="page"{{end}}>Tasks</a>
            <a class="area-nav-subitem{{if eq .Page "/workflows/reviews"}} active{{end}}" href="/workflows/reviews"{{if eq .Page "/workflows/reviews"}} aria-current="page"{{end}}>Reviews</a>
            <a class="area-nav-subitem{{if eq .Page "/workflows/todos"}} active{{end}}" href="/workflows/todos"{{if eq .Page "/workflows/todos"}} aria-current="page"{{end}}>Todos</a>
            <a class="area-nav-item{{if eq .Area "chat"}} active{{end}}" href="/chat"{{if eq .Area "chat"}} aria-current="{{if eq .Page "/chat"}}page{{else}}true{{end}}"{{end}}>Chat</a>
            <a class="area-nav-item{{if eq .Area "github"}} active{{end}}" href="/github"{{if eq .Area "github"}} aria-current="{{if eq .Page "/github"}}page{{else}}true{{end}}"{{end}}>GitHub</a>
            <a class="area-nav-item{{if eq .Area "knowledge"}} active{{end}}" href="/knowledge"{{if eq .Area "knowledge"}} aria-current="{{if eq .Page "/knowledge"}}page{{else}}true{{end}}"{{end}}>Knowledge</a>
            <a class="area-nav-item{{if eq .Area "docs"}} active{{end}}" href="/docs"{{if eq .Area "docs"}} aria-current="{{if eq .Page "/docs"}}page{{else}}true{{end}}"{{end}}>Docs</a>
            <a class="area-nav-item{{if eq .Area "inventory"}} active{{end}}" href="/inventory"{{if eq .Area "inventory"}} aria-current="{{if eq .Page "/inventory"}}page{{else}}true{{end}}"{{end}}>Inventar</a>
            {{end}}
          </nav>

          <!-- Die Einträge entstehen zur Laufzeit aus den Blöcken daneben,
               damit ein neuer Block nicht an zwei Stellen gepflegt werden
               muss. Auf /docs trägt dasselbe Element stattdessen den
               Dateiindex; Modifier und Beschriftung dafür kommen aus derselben
               .Area-Weiche, serverseitig und nicht beim Füllen aus docs.js:
               schmal bliebe der Index sonst so lange ausgeblendet, bis
               /api/docs antwortet.

               Die Übersicht von Workflows hat keines: ihre Karten sind genau
               die drei Seiten, die als Unterpunkte schon darüber stehen. Das
               Menü wäre dort dieselbe Liste ein zweites Mal. -->
          {{if ne .Page "/workflows"}}
          <nav id="block-nav"
               class="block-nav{{if eq .Area "docs"}} file-index{{end}}"
               aria-label="{{if eq .Area "docs"}}Dateien der Doku{{else}}Inhalt dieser Seite{{end}}"></nav>
          {{end}}

          <!-- Der Server hält keinen Zustand und liest die Platte bei jeder
               Anfrage neu; ein frischer Stand ist deshalb genau ein Neuladen
               der Seite. Der Knopf steht auf jeder Seite, weil der Weg dahin
               sonst über das Terminal führte. Er behält seine Höhe wie jeder
               Kasten der Spalte — nachgeben tut allein das Blockmenü. -->
          <button type="button" id="reload-page" class="secondary reload-page"
                  title="Lädt die Seite neu und holt damit den vollständigen Stand von der Platte.">Neu einlesen</button>
        </div>
{{end}}
