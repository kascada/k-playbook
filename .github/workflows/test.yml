name: Tests

# Prüft den Installer bei jedem Push und Pull Request: go vet, gofmt und
# go test. Lokal läuft dasselbe nur in `release-preflight`; ein Stand, der über
# `sichern` nach GitHub kommt, war bisher nirgends geprüft.
#
# Dazu die Tests der VS-Code-Erweiterung in einem eigenen Job: nur sie brauchen
# Node. Die Release-CI bleibt node-frei — die VSIX ist eingecheckt.
#
# Der Lauf ändert nichts und veröffentlicht nichts — rot heißt nur rot.

on:
  push:
    paths:
      - "installer/**"
      - "Makefile"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "installer/**"
      - "Makefile"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dieselbe Toolchain wie beim Release, ohne stillen Griff zu einer anderen.
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: installer

    steps:
      - name: Auschecken
        uses: actions/checkout@v4

      # Wie in release.yml: die toolchain-Zeile, nicht die go-Direktive.
      - name: Toolchain-Version lesen
        id: toolchain
        run: |
          set -eu
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)"
          test -n "$version" || { echo "In installer/go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: installer/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          set -eu
          unformatiert="$(gofmt -l .)"
          if [ -n "$unformatiert" ]; then
            printf 'gofmt: diese Dateien sind nicht formatiert:\n%s\n' "$unformatiert" >&2
            exit 1
          fi

      - name: go test
        run: go test ./...

  # Eigener Job, damit ein roter Lauf sagt, welche Seite rot ist, und damit
  # Node nur dort eingerichtet wird, wo es gebraucht wird. Die VSIX wird hier
  # nicht gebaut: sie ist eingecheckt, und `go test ./...` im Job oben prüft
  # mit TestVSIXPasstZurQuelle, dass sie zur Quelle passt.
  vscode:
    runs-on: ubuntu-latest

    steps:
      - name: Auschecken
        uses: actions/checkout@v4

      # Per Commit gepinnt, weil dieser Job als einziger fremden Code
      # ausführt, der nicht aus diesem Repo kommt. Der Kommentar nennt die
      # Fassung, der Hash ist maßgeblich.
      - name: Node einrichten
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: node --test
        run: make vscode-test
