name: Release

# Baut die vier Plattform-Binaries zu einem Tag und hängt sie als Assets an das
# Release. Der Clone trägt sie nicht mehr; `bin/install` und das Programm
# selbst (`k-playbook upgrade`, Update-Knopf) laden genau das eine, das zur
# Plattform der jeweiligen Umgebung passt — aus dem neuesten veröffentlichten
# Release (der Weiterleitung von releases/latest), geprüft gegen das SHA256SUMS
# seines Tags. Deshalb ist ein Release erst sichtbar, wenn alle Assets daran
# hängen: ein Tag allein und ein Entwurf erscheinen unter releases/latest
# nicht. Dazu kommt
# k-playbook-defaults.tar.gz mit dem Inhalt von defaults/ für Kephalaion.
#
# Geprüft wird gegen das committete SHA256SUMS: die erwarteten Summen kommen
# über Git, die Binaries über HTTPS. Weicht ein Hash ab, bricht der Lauf ab —
# dann wird kein Asset veröffentlicht, und VERSION darf nicht auf main.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, dessen Assets gebaut werden (z. B. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # Kein stiller Griff zu einer anderen Toolchain: weicht die installierte
      # Version von installer/go.mod ab, soll der Lauf scheitern statt
      # abweichende Prüfsummen zu erzeugen.
      GOTOOLCHAIN: local

    steps:
      - name: Getaggten Stand auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Liest die toolchain-Zeile aus installer/go.mod. Damit steht die Version
      # an genau einer Stelle — derselben, die `make release` lokal prüft.
      #
      # Nicht go-version-file: das nimmt die go-Direktive (1.26) und installiert
      # die neueste 1.26.x. Gebraucht wird exakt die toolchain-Version, sonst
      # bauen CI und Release-Commit verschiedene Binaries.
      - name: Toolchain-Version lesen
        id: toolchain
        run: |
          set -eu
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' installer/go.mod)"
          test -n "$version" || { echo "In installer/go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: installer/go.sum

      - name: Toolchain prüfen
        run: |
          set -eu
          want="$(awk '$1 == "toolchain" { print $2 }' installer/go.mod)"
          have="$(go env GOVERSION)"
          test -n "$want" || { echo "In installer/go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          if [ "$have" != "$want" ]; then
            echo "Go $have installiert, verlangt ist $want." >&2
            exit 1
          fi
          echo "Toolchain: $have"

      # Dieselben Flags wie im Makefile. -trimpath, CGO_ENABLED=0 und
      # -buildvcs=false sind es, die den Build reproduzierbar machen.
      - name: Binaries bauen
        run: |
          set -eu
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${target%-*}"
            arch="${target#*-}"
            output="../dist/k-playbook-${os}-${arch}"
            echo "Baue $output"
            (cd installer && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/kascada/k-playbook/installer/internal/buildinfo.Version=$(tr -d '[:space:]' < ../VERSION)" -o "$output" ./cmd/k-playbook)
          done

      - name: Gegen SHA256SUMS prüfen
        run: |
          set -eu
          test -f SHA256SUMS || { echo "SHA256SUMS fehlt im getaggten Stand." >&2; exit 1; }
          cd dist
          sha256sum -c ../SHA256SUMS

      - name: VERSION gegen den Tag prüfen
        run: |
          set -eu
          test -f VERSION || { echo "VERSION fehlt im getaggten Stand." >&2; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$TAG" ]; then
            echo "VERSION nennt $version, gebaut wird aber $TAG." >&2
            exit 1
          fi

      # Die Vorgaben, die Kephalaion aus dem neuesten Release nach
      # <hub>:k-playbook/defaults/ holt. Nach der VERSION-Prüfung, damit das
      # Archiv den geprüften Tag trägt; nicht in SHA256SUMS, das nur die
      # Binaries für bin/install nennt. Der Upload unten nimmt es über
      # dist/k-playbook-* mit.
      - name: Vorgaben packen
        run: .github/scripts/pack-defaults.sh dist/k-playbook-defaults.tar.gz

      # Die Notes tragen Installation und Aktualisierung vorweg, nicht nur die
      # Doku: die Release-Seite ist die Stelle, die beim Versionswechsel
      # tatsächlich gelesen wird. `--notes` wird von
      # `--generate-notes` nicht ersetzt: die generierte Liste hängt dahinter.
      #
      # Nur im Erstellungszweig. Der Upload-Zweig ist der Wiederholungslauf zu
      # einem Tag, dessen Release die Notes bereits trägt; ihn dort neu zu
      # schreiben überschriebe eine womöglich von Hand ergänzte Fassung.
      #
      # Veröffentlicht ist ein Release erst mit allen Assets — bin/install und
      # das Programm nehmen das neueste veröffentlichte Release:
      #
      #   - Erstellungszweig: `gh release create` mit Dateien legt das Release
      #     selbst als Entwurf an, lädt hoch und veröffentlicht erst danach;
      #     scheitert der Upload, löscht es den Entwurf (gh, pkg/cmd/release/
      #     create, draftWhileUploading).
      #   - Upload-Zweig: Hier kann ein veröffentlichtes Release ohne alle
      #     Assets stehen — von Hand angelegt, oder während `--clobber`, das
      #     ein vorhandenes Asset erst löscht und dann neu hochlädt. Deshalb
      #     wird es vorher zum Entwurf und erst nach dem Upload wieder
      #     veröffentlicht. Solange zeigt releases/latest auf das vorige
      #     Release.
      #
      # „Latest“ bekommt das Release nur, wenn sein Tag der höchste der Form
      # vX.Y.Z ist: Ohne Angabe markierte GitHub jedes neu veröffentlichte
      # Release so, auch den Wiederholungslauf zu einem älteren Tag.
      - name: Assets veröffentlichen
        run: |
          set -eu
          highest="$(git ls-remote --tags --refs origin 'v*' |
            awk '{ sub("^refs/tags/", "", $2); if ($2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/) print substr($2, 2) }' |
            sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1)"
          test -n "$highest" || { echo "Die Tags des Repos ließen sich nicht lesen." >&2; exit 1; }
          if [ "v$highest" = "$TAG" ]; then
            latest="--latest"
          else
            latest="--latest=false"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft
            gh release upload "$TAG" dist/k-playbook-* --clobber
            gh release edit "$TAG" --draft=false "$latest"
            exit 0
          fi
          intro="$(cat <<'EOF'
          ## Installieren und aktualisieren

          `k-playbook` wird einmal je Host und einmal je DevContainer installiert:

          ```bash
          curl -fsSL https://raw.githubusercontent.com/kascada/k-playbook/main/bin/install | bash
          # aus dem Clone im Projekt:
          make -C k-playbook install
          # ohne make:
          k-playbook/bin/install
          ```

          Alle drei tun dasselbe: Sie installieren das Binary des neuesten Releases, geprüft
          gegen die `SHA256SUMS` des Tags, und danach Kephalaion, wenn es fehlt. `VERSION` und
          `SHA256SUMS` eines Clones lesen sie nicht. Gebraucht werden `curl` oder `wget` und
          `sha256sum` oder `shasum`; `~/.local/bin` muss im PATH liegen, sonst bricht die
          Installation ab, bevor sie etwas lädt.

          Ein installiertes Programm aktualisiert sich aus dem Release, nicht aus dem Clone:
          `k-playbook upgrade` im Terminal oder „Programm aktualisieren“ in der Oberfläche. Die
          Umgebungsprüfung (Briefing, `k-playbook health`) warnt, wenn das Programm älter ist
          als das neueste Release, und `k-playbook version --all` nennt beide Versionen. Ein
          Clone-Update allein lädt kein Binary.

          Ältere Programme rufen dafür noch `k-playbook/bin/install` des Clones auf und prüfen
          das Ergebnis gegen dessen `VERSION` und `SHA256SUMS`: dort zuerst den Clone
          aktualisieren (Update-Knopf der Oberfläche oder `make -C k-playbook installer-update`),
          dann `k-playbook upgrade`.

          **Reihenfolge in einem Bestandsprojekt des abgelösten Wrapper-Modells:** zuerst den
          Clone aktualisieren, erst danach installieren. Vorher liegt `k-playbook/bin/install`
          noch gar nicht im Projekt. Zwischen beiden Schritten zeigen Commands, der Anstoßblock
          in `AGENTS.md` und die MCP-Registrierung noch auf den abgelösten Wrapper, und es gibt
          kein funktionierendes Kommando. Nach der Installation zieht der nächste Aufruf von
          `k-playbook` beides von selbst nach.
          EOF
          )"
          gh release create "$TAG" dist/k-playbook-* \
            "$latest" \
            --title "$TAG" \
            --notes "$intro" \
            --generate-notes
