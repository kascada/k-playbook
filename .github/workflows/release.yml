name: Release

# Baut die vier Plattform-Binaries zu einem Tag und hängt sie als Assets an das
# Release. Der Clone trägt sie nicht mehr; `bin/install` lädt genau das eine,
# das zur Plattform der jeweiligen Umgebung passt.
#
# Geprüft wird gegen das committete SHA256SUMS: die erwarteten Summen kommen
# über Git, die Binaries über HTTPS. Weicht ein Hash ab, bricht der Lauf ab —
# dann wird kein Asset veröffentlicht, und VERSION darf nicht auf main.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, dessen Assets gebaut werden (z. B. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # Kein stiller Griff zu einer anderen Toolchain: weicht die installierte
      # Version von installer/go.mod ab, soll der Lauf scheitern statt
      # abweichende Prüfsummen zu erzeugen.
      GOTOOLCHAIN: local

    steps:
      - name: Getaggten Stand auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Liest die toolchain-Zeile aus installer/go.mod. Damit steht die Version
      # an genau einer Stelle — derselben, die `make release` lokal prüft.
      #
      # Nicht go-version-file: das nimmt die go-Direktive (1.26) und installiert
      # die neueste 1.26.x. Gebraucht wird exakt die toolchain-Version, sonst
      # bauen CI und Release-Commit verschiedene Binaries.
      - name: Toolchain-Version lesen
        id: toolchain
        run: |
          set -eu
          version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' installer/go.mod)"
          test -n "$version" || { echo "In installer/go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: installer/go.sum

      - name: Toolchain prüfen
        run: |
          set -eu
          want="$(awk '$1 == "toolchain" { print $2 }' installer/go.mod)"
          have="$(go env GOVERSION)"
          test -n "$want" || { echo "In installer/go.mod fehlt die toolchain-Zeile." >&2; exit 1; }
          if [ "$have" != "$want" ]; then
            echo "Go $have installiert, verlangt ist $want." >&2
            exit 1
          fi
          echo "Toolchain: $have"

      # Dieselben Flags wie im Makefile. -trimpath, CGO_ENABLED=0 und
      # -buildvcs=false sind es, die den Build reproduzierbar machen.
      - name: Binaries bauen
        run: |
          set -eu
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            os="${target%-*}"
            arch="${target#*-}"
            output="../dist/k-playbook-${os}-${arch}"
            echo "Baue $output"
            (cd installer && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/kascada/k-playbook/installer/internal/buildinfo.Version=$(tr -d '[:space:]' < ../VERSION)" -o "$output" ./cmd/k-playbook)
          done

      - name: Gegen SHA256SUMS prüfen
        run: |
          set -eu
          test -f SHA256SUMS || { echo "SHA256SUMS fehlt im getaggten Stand." >&2; exit 1; }
          cd dist
          sha256sum -c ../SHA256SUMS

      - name: VERSION gegen den Tag prüfen
        run: |
          set -eu
          test -f VERSION || { echo "VERSION fehlt im getaggten Stand." >&2; exit 1; }
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$TAG" ]; then
            echo "VERSION nennt $version, gebaut wird aber $TAG." >&2
            exit 1
          fi

      # Die Notes tragen den Bootstrap vorweg, nicht nur die Doku: er ist der
      # eine Handgriff, den auch ein Bestandsprojekt nach einem Clone-Update mit
      # gewechselter VERSION noch braucht, und die Release-Seite ist die Stelle,
      # die beim Versionswechsel tatsächlich gelesen wird. `--notes` wird von
      # `--generate-notes` nicht ersetzt: die generierte Liste hängt dahinter.
      #
      # Nur im Erstellungszweig. Der Upload-Zweig ist der Wiederholungslauf zu
      # einem Tag, dessen Release die Notes bereits trägt; ihn dort neu zu
      # schreiben überschriebe eine womöglich von Hand ergänzte Fassung.
      - name: Assets veröffentlichen
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/k-playbook-* --clobber
            exit 0
          fi
          intro="$(cat <<'EOF'
          ## Installieren und aktualisieren

          `k-playbook` wird einmal je Host und einmal je DevContainer installiert. Nach dem
          Clone und nach jedem Clone-Update, bei dem `VERSION` wechselt, gehört der
          Bootstrap dazu — der Update-Pfad lädt von sich aus kein Binary:

          ```bash
          make -C k-playbook install
          # ohne make:
          k-playbook/bin/install
          ```

          Ein Zielprojekt hat kein eigenes `install`-Target; der Aufruf geht immer über den
          Clone. `~/.local/bin` muss im PATH liegen, sonst bricht der Bootstrap ab, bevor er
          etwas lädt.

          **Reihenfolge in einem Bestandsprojekt:** zuerst den Clone aktualisieren
          (Update-Knopf der Oberfläche oder `make -C k-playbook installer-update`), erst
          danach den Bootstrap. Vorher liegt `k-playbook/bin/install` noch gar nicht im
          Projekt. Zwischen beiden Schritten zeigen Commands, der Anstoßblock in `AGENTS.md`
          und die MCP-Registrierung noch auf den abgelösten Wrapper, und es gibt kein
          funktionierendes Kommando. Nach dem Bootstrap zieht der nächste Aufruf von
          `k-playbook` beides von selbst nach.
          EOF
          )"
          gh release create "$TAG" dist/k-playbook-* \
            --title "$TAG" \
            --notes "$intro" \
            --generate-notes
