name: VERSION-Wächter

# Code unter installer/ oder share/ kommt auf main nur zusammen mit einem
# Versionswechsel an. Programm und bin/install holen das Binary des neuesten
# veröffentlichten Releases (releases/latest); Code, der ohne neue VERSION auf
# main landet, gehört zu keinem Release und erreicht keine Installation, ohne
# dass etwas abbricht. Genau dieser Fall wird hier rot. Der Release-Weg
# (make release, dann make release-publish) bringt VERSION und Code in einem
# Commit auf main.
#
# share/ — Commands und Skills — bettet das Binary ein; eine Änderung dort ist
# eine am Binary. defaults/ dagegen kommt über den Hub (Release-Asset
# k-playbook-defaults.tar.gz), nicht über das Binary, und steht hier nicht.

on:
  push:
    branches:
      - main
    paths:
      - "installer/**"
      - "share/**"
      # Prosa baut nicht mit: eine Änderung dort verlangt kein neues Binary und
      # damit auch keinen VERSION-Bump.
      - "!installer/docs/**"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Vollständige Historie auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: VERSION muss mitgehen
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu

          # Beim ersten Push eines Branches gibt es kein Vorher.
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000)
              echo "Kein Vorgänger-Commit — nichts zu vergleichen."
              exit 0
              ;;
          esac
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Vorgänger-Commit $BEFORE ist nicht erreichbar — übersprungen."
            exit 0
          fi

          # Eine fehlende Datei zählt als leerer Wert: dann ist jeder Bump ein
          # Wechsel, und ein Stand ohne VERSION fällt ohnehin auf.
          before_version="$(git show "$BEFORE:VERSION" 2>/dev/null || true)"
          after_version="$(git show "$AFTER:VERSION" 2>/dev/null || true)"

          if [ "$before_version" = "$after_version" ]; then
            echo "installer/ oder share/ hat sich geändert, VERSION aber nicht ($after_version)." >&2
            echo "" >&2
            echo "Code unter installer/ oder share/ kommt auf main nur zusammen mit" >&2
            echo "einem Versionswechsel an: Installationen holen das Binary des neuesten" >&2
            echo "Releases, und dieser Code gehört zu keinem." >&2
            echo "" >&2
            echo "Auflösung: make release VERSION=<neue Version>, dann nach dem" >&2
            echo "Asset-Upload make release-publish VERSION=<neue Version>." >&2
            exit 1
          fi

          echo "VERSION: $before_version -> $after_version"
